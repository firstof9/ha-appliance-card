name: Release Drafter

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # @v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
